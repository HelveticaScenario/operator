name: Release
on:
    push:
        branches:
            - master
    workflow_dispatch:

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    # A release is due when package.json names a version that has release
    # notes (.changes/vX.Y.Z.md) but no published GitHub release yet; merging
    # the release PR is what creates that state. The release starts as a draft
    # so the update feed, which ignores drafts, never serves it half-uploaded.
    draft:
        name: Create draft release
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            release: ${{ steps.draft.outputs.release }}
            version: ${{ steps.draft.outputs.version }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Create draft release
              id: draft
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION=$(node -p "require('./package.json').version")
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  NOTES=".changes/v$VERSION.md"
                  if [ "$GITHUB_REF" != "refs/heads/master" ] || [ ! -f "$NOTES" ]; then
                    echo "release=false" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  IS_DRAFT=$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
                  case "$IS_DRAFT" in
                    false)
                      echo "release=false" >> "$GITHUB_OUTPUT"
                      ;;
                    true)
                      echo "release=true" >> "$GITHUB_OUTPUT"
                      ;;
                    missing)
                      tail -n +2 "$NOTES" > "$RUNNER_TEMP/notes.md"
                      gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
                        --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
                      echo "release=true" >> "$GITHUB_OUTPUT"
                      ;;
                  esac

    build:
        name: Build and Release
        needs: draft
        # Outside a release, a manual run still builds and tests every platform.
        if: needs.draft.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [macos-latest, macos-15-intel, ubuntu-latest, windows-latest]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24.12.0
                  cache: 'yarn'

            # Installs the channel + components pinned in rust-toolchain.toml so
            # release builds use the same toolchain as CI and local dev.
            - name: Setup Rust (pinned via rust-toolchain.toml)
              run: rustup toolchain install

            - name: Add macOS aarch64 target
              if: matrix.os == 'macos-latest'
              run: rustup target add aarch64-apple-darwin

            # Building the Syphon framework compiles a Metal shader. The Metal
            # compiler is bundled in Xcode <= 16 but split into a separately
            # downloadable component in Xcode 26+ (where -downloadComponent also
            # first appears). Only fetch it when `metal` is actually missing, so
            # this step is a no-op on the current runner image and starts working
            # automatically once macos-latest moves to Xcode 26.
            - name: Install Metal Toolchain
              if: runner.os == 'macOS'
              run: |
                  if xcrun --find metal >/dev/null 2>&1; then
                      echo "Metal toolchain already present; skipping download."
                  else
                      xcodebuild -downloadComponent MetalToolchain
                  fi

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Install Linux dependencies
              if: matrix.os == 'ubuntu-latest'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libasound2-dev libudev-dev libjack-jackd2-dev rpm

            # - name: Setup ASIO SDK (Windows)
            #   if: matrix.os == 'windows-latest'
            #   shell: powershell
            #   run: |
            #       $url = "https://www.steinberg.net/asiosdk"
            #       $zip = "$env:TEMP\asiosdk.zip"
            #       Invoke-WebRequest -Uri $url -OutFile $zip
            #       Expand-Archive -Path $zip -DestinationPath "$env:TEMP\asio_temp"
            #       $subFolder = Get-ChildItem -Path "$env:TEMP\asio_temp" -Directory | Select-Object -First 1
            #       Move-Item -Path $subFolder.FullName -Destination "$env:TEMP\asio_sdk"

            # macOS-specific: Import Apple certificate for signing
            - name: Import Apple Certificate
              if: runner.os == 'macOS'
              env:
                  APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
              run: |
                  # Create variables
                  CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
                  KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
                  KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

                  # Decode certificate
                  echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

                  # Create temporary keychain
                  security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
                  security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

                  # Import certificate to keychain
                  security import $CERTIFICATE_PATH \
                    -P "$APPLE_CERTIFICATE_PASSWORD" \
                    -A \
                    -t cert \
                    -f pkcs12 \
                    -k $KEYCHAIN_PATH

                  # Set the keychain as default
                  security list-keychain -d user -s $KEYCHAIN_PATH

                  # Enable codesigning from this keychain
                  security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

                  # Verify the identity is available
                  security find-identity -v -p codesigning $KEYCHAIN_PATH

            - name: Build native module
              run: yarn build
              working-directory: crates/modular
              env:
                  NO_COLOR: 1
                  CARGO_TERM_COLOR: never

            - name: Run tests
              run: yarn test

            - name: Publish to draft release
              if: needs.draft.outputs.release == 'true'
              run: yarn forge-publish
              env:
                  NODE_OPTIONS: '--max-old-space-size=6144'
                  NO_COLOR: 1
                  CARGO_TERM_COLOR: never
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # macOS signing and notarization
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

            # macOS-specific: Cleanup keychain
            - name: Cleanup Keychain
              if: runner.os == 'macOS' && always()
              run: |
                  KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
                  if [ -f "$KEYCHAIN_PATH" ]; then
                    security delete-keychain $KEYCHAIN_PATH
                  fi

    publish:
        name: Publish release
        needs: [draft, build]
        if: needs.draft.outputs.release == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Publish release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ needs.draft.outputs.version }}
              run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest
