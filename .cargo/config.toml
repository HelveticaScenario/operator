# x86_64 builds assume x86-64-v2 (SSE4.2, POPCNT). The startup CPU check
# (`cpu_supports_build` in crates/modular, `LINUX_REQUIRED_FLAGS` in
# src/main/cpuGate.ts) tests for the same features, so raising this level
# needs both lists extended to match.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-cpu=x86-64-v2", "-C", "target-feature=+crt-static"]

# sccache client-side mode runs each rustc inside its own build, under that
# build's jobserver, so killing a build (Ctrl-C, a watch-native restart) cannot
# leak tokens from the shared sccache server and stall every build on the
# machine. No effect without sccache.
[env]
SCCACHE_CLIENT_SIDE = "1"
